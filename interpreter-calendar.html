r+="<button class=\"ev "+(e.new?"new":e.chg?"chg":"")+"\" data-i=\""+i+"\">"+(e.new?"<span class=\"tag\">New</span>":e.chg?"<span class=\"tag c\">Updated</span>":"")+"<b>"+esc(e.t)+"</b>"+(e.s?"<i>"+esc(e.s+(e.e2?" to "+e.e2:""))+"</i>":"")+(e.l?"<i>"+esc(e.l)+"</i>":"")+(e.i?"<i>"+esc(e.i)+"</i>":"")+"</button>"});
r+="</td>"}r+="</tr>";if(any||w<5)h+=r}
h+="</tbody></table>";document.getElementById("grid").innerHTML=h;}
function renderNew(){var n=P.events.filter(function(e){return e.new}),c=P.events.filter(function(e){return e.chg});
if(!n.length&&!c.length){document.getElementById("new").innerHTML="";return}
var CAP=18,total=n.length+c.length,shown=0;
var h="<div class=\"card whatsnew noprint\"><h2>What\u2019s new"+(P.since?" since "+esc(P.since):"")+"</h2><ul>";
n.forEach(function(e){if(shown++>=CAP)return;h+="<li><b>New:</b> "+esc(e.t)+" \u2014 "+esc(longD(e.d))+(e.s?", "+esc(e.s+(e.e2?" to "+e.e2:"")):"")+(e.l?" \u2014 "+esc(e.l):"")+"</li>"});
c.forEach(function(e){if(shown++>=CAP)return;h+="<li><b>Updated:</b> "+esc(e.t)+" \u2014 "+esc(longD(e.d))+"</li>"});
if(total>CAP)h+="<li><b>\u2026and "+(total-CAP)+" more</b> \u2014 they are highlighted on the calendar below.</li>";
h+="</ul></div>";document.getElementById("new").innerHTML=h;}
function longD(iso){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return DW[d.getDay()]+", "+MO[d.getMonth()]+" "+d.getDate()}
function open(i){var e=P.events[i];document.getElementById("dt").textContent=e.t;
var h="";function row(k,v){if(v)h+="<dt>"+k+"</dt><dd>"+esc(v)+"</dd>"}
row("Date",longD(e.d));row("Time",e.s?e.s+(e.e2?" to "+e.e2:""):"");row("Location",e.l);row("On-site contact",e.o);
row("Interpreter(s) assigned",e.i||"Not yet assigned");if(P.showStatus)row("Request status",e.st);if(P.showNotes)row("Notes",e.n);
document.getElementById("dd").innerHTML=h;document.getElementById("dlg").showModal();}
document.addEventListener("click",function(ev){var b=ev.target.closest?ev.target.closest(".ev"):null;if(b)open(+b.getAttribute("data-i"))});
